# Fallback merge for a reviewed pull request when GitHub's own auto-merge is refused (skill merge-and-publish).
# A thread adds the `automerge` label. This workflow merges the pull request (merge commit) once both required
# checks of check.yml passed on its newest commit. It looks again when the label goes on and every time a check
# run finishes, so the label can go on before or after CI is green. The rules are in .github/scripts/automerge.sh.
name: automerge

on:
  pull_request:
    types: [labeled]
  workflow_run:
    workflows: [check]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  actions: write # starts check.yml on main and, with AUTO_PUBLISH, publish.yml after the merge

concurrency:
  group: automerge-${{ github.event.pull_request.number || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  automerge:
    name: Merge if labeled automerge
    if: >-
      (github.event_name == 'pull_request' && github.event.label.name == 'automerge') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - run: bash .github/scripts/automerge.sh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH }}
