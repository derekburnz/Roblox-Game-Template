# Selene lints Luau. `std = "roblox"` makes it download Roblox API definitions on first run (roblox.yml, gitignored).
std = "roblox"
# Third-party single-file modules are not ours to lint.
exclude = ["src/server/Vendor/**"]

[lints]
# Shadowing common names is allowed; everything else keeps its default (warn or deny).
shadowing = "allow"
